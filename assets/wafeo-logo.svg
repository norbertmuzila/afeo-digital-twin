<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WAFEO logo: maize plant with satellite">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f2"/>
    </radialGradient>
    <linearGradient id="cob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd84d"/>
      <stop offset="55%" stop-color="#f6c324"/>
      <stop offset="100%" stop-color="#e0a915"/>
    </linearGradient>
    <linearGradient id="leafL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#2f9e44"/>
    </linearGradient>
    <linearGradient id="leafD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#1e7a34"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cbf5c"/>
      <stop offset="100%" stop-color="#2f9e44"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="36" fill="url(#bg)"/>

  <!-- Satellite -->
  <g transform="translate(250 120) rotate(-18)">
    <!-- solar panels -->
    <g fill="#1f5f6b" stroke="#15454e" stroke-width="2">
      <rect x="-96" y="-26" width="60" height="52" rx="4"/>
      <rect x="36" y="-26" width="60" height="52" rx="4"/>
    </g>
    <g stroke="#3a8fa0" stroke-width="2">
      <line x1="-66" y1="-26" x2="-66" y2="26"/><line x1="-96" y1="0" x2="-36" y2="0"/>
      <line x1="66" y1="-26" x2="66" y2="26"/><line x1="36" y1="0" x2="96" y2="0"/>
    </g>
    <!-- body -->
    <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#236b78" stroke="#15454e" stroke-width="2"/>
    <!-- dish -->
    <ellipse cx="22" cy="30" rx="20" ry="10" fill="#2c7f8e" stroke="#15454e" stroke-width="2" transform="rotate(28 22 30)"/>
    <line x1="6" y1="14" x2="22" y2="30" stroke="#15454e" stroke-width="3"/>
  </g>

  <!-- Signal waves -->
  <g fill="none" stroke="#1f5f6b" stroke-width="7" stroke-linecap="round">
    <path d="M330 150 a34 34 0 0 1 0 60" opacity="0.9"/>
    <path d="M348 134 a58 58 0 0 1 0 92" opacity="0.6"/>
    <path d="M366 118 a82 82 0 0 1 0 124" opacity="0.35"/>
  </g>

  <!-- Stem -->
  <path d="M250 470 C250 380 250 320 256 270 C262 320 262 380 262 470 Z" fill="url(#stem)"/>

  <!-- Husk leaves -->
  <path d="M256 360 C180 340 130 380 110 440 C175 420 215 400 256 372 Z" fill="url(#leafD)"/>
  <path d="M256 360 C332 340 382 380 402 440 C337 420 297 400 256 372 Z" fill="url(#leafL)"/>
  <path d="M256 320 C195 295 150 318 128 372 C188 352 226 338 256 330 Z" fill="url(#leafL)"/>
  <path d="M256 320 C317 295 362 318 384 372 C324 352 286 338 256 330 Z" fill="url(#leafD)"/>

  <!-- Corn cob -->
  <g>
    <path d="M256 196 C292 196 312 224 312 268 C312 322 290 372 256 372 C222 372 200 322 200 268 C200 224 220 196 256 196 Z" fill="url(#cob)" stroke="#cf9b10" stroke-width="3"/>
    <!-- kernels -->
    <g fill="#e9b21e" opacity="0.85">
      <g>
        <circle cx="232" cy="232" r="8"/><circle cx="256" cy="228" r="8"/><circle cx="280" cy="232" r="8"/>
        <circle cx="226" cy="258" r="8"/><circle cx="250" cy="254" r="8"/><circle cx="274" cy="254" r="8"/><circle cx="290" cy="262" r="7"/>
        <circle cx="224" cy="286" r="8"/><circle cx="248" cy="282" r="8"/><circle cx="272" cy="282" r="8"/><circle cx="290" cy="288" r="7"/>
        <circle cx="228" cy="314" r="8"/><circle cx="252" cy="312" r="8"/><circle cx="276" cy="312" r="8"/>
        <circle cx="238" cy="340" r="7"/><circle cx="258" cy="340" r="7"/><circle cx="276" cy="338" r="7"/>
      </g>
    </g>
    <path d="M220 232 Q220 300 240 360" fill="none" stroke="#cf9b10" stroke-width="2" opacity="0.4"/>
    <path d="M292 232 Q292 300 272 360" fill="none" stroke="#cf9b10" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
