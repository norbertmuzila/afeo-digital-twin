<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WAFEO logo: maize plant with letter A and satellite">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f3f1"/>
    </radialGradient>
    <linearGradient id="cob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdf57"/>
      <stop offset="55%" stop-color="#f4c023"/>
      <stop offset="100%" stop-color="#dca310"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#2f9e44"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#54c25a"/>
      <stop offset="100%" stop-color="#1e7a34"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cbf5c"/>
      <stop offset="100%" stop-color="#2f9e44"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="36" fill="url(#bg)"/>

  <!-- Satellite -->
  <g transform="translate(248 118) rotate(-16)">
    <g fill="#1f5f6b" stroke="#15454e" stroke-width="2">
      <rect x="-92" y="-24" width="56" height="48" rx="4"/>
      <rect x="36" y="-24" width="56" height="48" rx="4"/>
    </g>
    <g stroke="#3a8fa0" stroke-width="2">
      <line x1="-64" y1="-24" x2="-64" y2="24"/><line x1="-92" y1="0" x2="-36" y2="0"/>
      <line x1="64" y1="-24" x2="64" y2="24"/><line x1="36" y1="0" x2="92" y2="0"/>
    </g>
    <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#236b78" stroke="#15454e" stroke-width="2"/>
    <ellipse cx="20" cy="28" rx="18" ry="9" fill="#2c7f8e" stroke="#15454e" stroke-width="2" transform="rotate(28 20 28)"/>
    <line x1="6" y1="13" x2="20" y2="28" stroke="#15454e" stroke-width="3"/>
  </g>

  <!-- Signal waves -->
  <g fill="none" stroke="#1f5f6b" stroke-width="7" stroke-linecap="round">
    <path d="M322 150 a32 32 0 0 1 0 56" opacity="0.9"/>
    <path d="M340 134 a55 55 0 0 1 0 88" opacity="0.6"/>
    <path d="M358 118 a78 78 0 0 1 0 120" opacity="0.35"/>
  </g>

  <!-- Stem -->
  <path d="M249 472 C249 388 249 330 256 286 C263 330 263 388 263 472 Z" fill="url(#stem)"/>

  <!-- Husk leaves (fan) -->
  <path d="M256 372 C168 360 112 396 92 456 C166 438 212 414 256 384 Z" fill="url(#leafB)"/>
  <path d="M256 372 C344 360 400 396 420 456 C346 438 300 414 256 384 Z" fill="url(#leafA)"/>
  <path d="M256 338 C180 318 130 344 110 402 C176 382 218 364 256 350 Z" fill="url(#leafA)"/>
  <path d="M256 338 C332 318 382 344 402 402 C336 382 294 364 256 350 Z" fill="url(#leafB)"/>
  <path d="M256 306 C198 286 158 304 140 350 C196 332 230 318 256 312 Z" fill="url(#leafB)"/>
  <path d="M256 306 C314 286 354 304 372 350 C316 332 282 318 256 312 Z" fill="url(#leafA)"/>

  <!-- Corn cob -->
  <g>
    <path d="M256 198 C290 198 309 226 309 270 C309 322 288 372 256 372 C224 372 203 322 203 270 C203 226 222 198 256 198 Z" fill="url(#cob)" stroke="#cf9b10" stroke-width="3"/>
    <g fill="#e7ac1b" opacity="0.85">
      <circle cx="234" cy="232" r="7"/><circle cx="256" cy="228" r="7"/><circle cx="278" cy="232" r="7"/>
      <circle cx="228" cy="256" r="7"/><circle cx="250" cy="252" r="7"/><circle cx="272" cy="252" r="7"/><circle cx="286" cy="260" r="6"/>
      <circle cx="226" cy="282" r="7"/><circle cx="248" cy="278" r="7"/><circle cx="270" cy="278" r="7"/><circle cx="286" cy="286" r="6"/>
      <circle cx="230" cy="308" r="7"/><circle cx="252" cy="306" r="7"/><circle cx="274" cy="306" r="7"/>
    </g>
  </g>

  <!-- Letter A overlaid on the plant -->
  <g fill="none" stroke="#1f7a34" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 366 L256 256 L286 366"/>
    <path d="M238 322 L274 322"/>
  </g>
  <!-- small leaf curling from the apex of the A -->
  <path d="M256 256 C272 240 296 240 312 252 C292 260 272 262 256 268 Z" fill="url(#leafA)"/>
</svg>
